
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>Rock Paper Scissors - Mini Games BD</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:#f4f6ff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
}

.game{
  width:100%;
  max-width:440px;
  background:#151e34;
  border:1px solid #293653;
  border-radius:22px;
  padding:22px;
  text-align:center;
  box-shadow:0 15px 45px #0005;
}

.back{
  display:inline-block;
  color:#aab8d4;
  text-decoration:none;
  margin-bottom:20px;
  font-size:14px;
}

h1{
  font-size:29px;
  margin-bottom:8px;
}

.subtitle{
  color:#9eacc6;
  font-size:14px;
  margin-bottom:24px;
}

.scores{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:25px;
}

.score-box{
  background:#0d1528;
  border-radius:12px;
  padding:12px 5px;
}

.score-box span{
  display:block;
  color:#9eacc6;
  font-size:11px;
  margin-bottom:6px;
}

.score-box strong{
  color:#55e6bd;
  font-size:24px;
}

.battle{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:20px;
}

.player{
  background:#0d1528;
  border-radius:14px;
  padding:16px 8px;
}

.player h3{
  color:#aab8d4;
  font-size:13px;
  margin-bottom:12px;
}

.hand{
  font-size:55px;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.vs{
  color:#55e6bd;
  font-weight:bold;
  font-size:12px;
  margin-top:8px;
}

.result{
  background:#0d1528;
  border-radius:12px;
  padding:16px;
  min-height:72px;
  margin-bottom:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:6px;
}

.result strong{
  font-size:19px;
  color:#55e6bd;
}

.result span{
  color:#9eacc6;
  font-size:12px;
}

.choices-title{
  font-size:15px;
  margin-bottom:14px;
}

.choices{
  display:flex;
  justify-content:center;
  gap:12px;
}

.choice{
  width:90px;
  height:90px;
  border-radius:16px;
  background:#293753;
  color:white;
  border:2px solid transparent;
  font-size:37px;
  transition:.2s;
}

.choice:active{
  transform:scale(.92);
}

.choice:hover{
  border-color:#55e6bd;
  background:#344565;
}

.reset{
  width:100%;
  margin-top:20px;
  background:linear-gradient(120deg,#55e6bd,#50c9f2);
  color:#081322;
  padding:14px;
  font-size:14px;
}

button{
  cursor:pointer;
  font-weight:bold;
  border:0;
}

.help{
  color:#8e9db8;
  font-size:12px;
  line-height:1.6;
  margin-top:17px;
}

@media(max-width:360px){
  .game{padding:15px}
  .choice{width:75px;height:75px;font-size:32px}
  .hand{font-size:45px}
}
</style>
</head>

<body>

<div class="game">

<a href="../index.html" class="back">← Back to Home</a>

<h1>✊ Rock Paper Scissors</h1>
<p class="subtitle">Challenge the computer and win!</p>

<div class="scores">

  <div class="score-box">
    <span>YOU</span>
    <strong id="playerScore">0</strong>
  </div>

  <div class="score-box">
    <span>DRAWS</span>
    <strong id="drawScore">0</strong>
  </div>

  <div class="score-box">
    <span>COMPUTER</span>
    <strong id="computerScore">0</strong>
  </div>

</div>

<div class="battle">

  <div class="player">
    <h3>YOUR CHOICE</h3>
    <div class="hand" id="playerHand">❔</div>
    <div class="vs">PLAYER</div>
  </div>

  <div class="player">
    <h3>COMPUTER CHOICE</h3>
    <div class="hand" id="computerHand">❔</div>
    <div class="vs">COMPUTER</div>
  </div>

</div>

<div class="result" id="result">
  <strong>Ready to Play?</strong>
  <span>Choose your move below!</span>
</div>

<h3 class="choices-title">Choose Your Move</h3>

<div class="choices">

  <button class="choice" data-choice="rock" aria-label="Rock">✊</button>

  <button class="choice" data-choice="paper" aria-label="Paper">✋</button>

  <button class="choice" data-choice="scissors" aria-label="Scissors">✌️</button>

</div>

<button class="reset" id="resetBtn">↻ Reset Score</button>

<p class="help">
  Rock beats Scissors.<br>
  Scissors beats Paper.<br>
  Paper beats Rock.
</p>

</div>

<script>
const playerHand = document.getElementById("playerHand");
const computerHand = document.getElementById("computerHand");

const playerScoreText = document.getElementById("playerScore");
const computerScoreText = document.getElementById("computerScore");
const drawScoreText = document.getElementById("drawScore");

const resultBox = document.getElementById("result");
const resetBtn = document.getElementById("resetBtn");

const choices = {
  rock:"✊",
  paper:"✋",
  scissors:"✌️"
};

let playerScore = 0;
let computerScore = 0;
let drawScore = 0;

function play(playerChoice){

  const options = ["rock","paper","scissors"];

  const computerChoice =
    options[Math.floor(Math.random()*3)];

  playerHand.textContent = choices[playerChoice];
  computerHand.textContent = choices[computerChoice];

  let result = "";
  let detail = "";

  if(playerChoice===computerChoice){

    drawScore++;
    result = "🤝 It's a Draw!";
    detail = "Both chose "+playerChoice+".";

  }else if(
    (playerChoice==="rock" && computerChoice==="scissors") ||
    (playerChoice==="paper" && computerChoice==="rock") ||
    (playerChoice==="scissors" && computerChoice==="paper")
  ){

    playerScore++;
    result = "🎉 You Win!";
    detail = playerChoice+" beats "+computerChoice+".";

  }else{

    computerScore++;
    result = "😢 You Lose!";
    detail = computerChoice+" beats "+playerChoice+".";

  }

  updateScore();

  resultBox.innerHTML =
    "<strong>"+result+"</strong><span>"+detail+"</span>";
}

function updateScore(){

  playerScoreText.textContent = playerScore;
  computerScoreText.textContent = computerScore;
  drawScoreText.textContent = drawScore;

}

document.querySelectorAll("[data-choice]").forEach(button=>{

  button.addEventListener("click",()=>{

    play(button.dataset.choice);

  });

});

resetBtn.addEventListener("click",()=>{

  playerScore = 0;
  computerScore = 0;
  drawScore = 0;

  updateScore();

  playerHand.textContent = "❔";
  computerHand.textContent = "❔";

  resultBox.innerHTML =
    "<strong>Score Reset!</strong><span>Choose your move and play again.</span>";

});

</script>

</body>
</html>
