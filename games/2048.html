
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>2048 Game - Mini Games BD</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:#f4f6ff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
}

.game{
  width:100%;
  max-width:440px;
  background:#151e34;
  border:1px solid #293653;
  border-radius:22px;
  padding:20px;
}

.back{
  display:inline-block;
  color:#aab8d4;
  text-decoration:none;
  margin-bottom:18px;
  font-size:14px;
}

h1{
  font-size:34px;
  margin-bottom:6px;
}

.subtitle{
  color:#aab8d4;
  font-size:14px;
  margin-bottom:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.scores{
  display:flex;
  gap:8px;
}

.score-box{
  background:#0d1528;
  border-radius:10px;
  padding:9px 13px;
  min-width:75px;
  text-align:center;
}

.score-box span{
  display:block;
  font-size:10px;
  color:#9eacc6;
  margin-bottom:5px;
}

.score-box strong{
  font-size:19px;
  color:#55e6bd;
}

.actions{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 13px;
  font-weight:bold;
  font-size:13px;
  cursor:pointer;
}

.new{
  background:#55e6bd;
  color:#081322;
  flex:1;
}

.undo{
  background:#293753;
  color:#fff;
  flex:1;
}

.board{
  width:100%;
  aspect-ratio:1;
  background:#0d1528;
  border:2px solid #344565;
  border-radius:13px;
  padding:8px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(4,1fr);
  gap:8px;
  touch-action:none;
  user-select:none;
}

.cell{
  border-radius:8px;
  background:#202d45;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(19px,6vw,29px);
  font-weight:bold;
  color:#172033;
}

.v2{background:#e9e3d6}
.v4{background:#e8d6ad}
.v8{background:#f3ae72;color:#fff}
.v16{background:#f18c60;color:#fff}
.v32{background:#ed765b;color:#fff}
.v64{background:#e95a48;color:#fff}
.v128{background:#e9ce63;color:#fff;font-size:clamp(16px,5vw,25px)}
.v256{background:#dfc34b;color:#fff;font-size:clamp(16px,5vw,25px)}
.v512{background:#d6b73a;color:#fff;font-size:clamp(16px,5vw,25px)}
.v1024{background:#c5a52d;color:#fff;font-size:clamp(13px,4vw,21px)}
.v2048{background:#55e6bd;color:#081322;font-size:clamp(13px,4vw,21px)}
.high{background:#a78bfa;color:#fff;font-size:clamp(13px,4vw,21px)}

.message{
  min-height:42px;
  text-align:center;
  color:#aab8d4;
  font-size:14px;
  padding:13px 0 5px;
}

.message strong{
  color:#55e6bd;
}

.help{
  color:#8e9db8;
  font-size:12px;
  text-align:center;
  line-height:1.6;
  margin-top:12px;
}

@media(max-width:360px){
  .game{padding:14px}
  .board{gap:5px;padding:6px}
  .score-box{padding:8px}
}
</style>
</head>

<body>

<div class="game">

<a href="../index.html" class="back">← Back to Home</a>

<div class="top">
  <div>
    <h1>2048</h1>
    <p class="subtitle">Join the numbers and reach 2048!</p>
  </div>

  <div class="scores">
    <div class="score-box">
      <span>SCORE</span>
      <strong id="score">0</strong>
    </div>
    <div class="score-box">
      <span>BEST</span>
      <strong id="best">0</strong>
    </div>
  </div>
</div>

<div class="actions">
  <button class="new" id="newGame">New Game</button>
  <button class="undo" id="undo">↶ Undo</button>
</div>

<div class="board" id="board"></div>

<div class="message" id="message">
  Use arrow keys or swipe to play!
</div>

<p class="help">
  Combine two matching numbers to create a bigger number.<br>
  Reach 2048 to win!
</p>

</div>

<script>
const boardElement = document.getElementById("board");
const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");
const messageElement = document.getElementById("message");
const undoButton = document.getElementById("undo");

let grid = [];
let score = 0;
let best = Number(localStorage.getItem("2048Best")) || 0;
let previous = null;
let won = false;
let gameOver = false;

bestElement.textContent = best;

function emptyGrid(){
  return Array.from({length:4},()=>[0,0,0,0]);
}

function savePrevious(){
  previous = {
    grid:grid.map(row=>[...row]),
    score:score,
    won:won,
    gameOver:gameOver
  };
  undoButton.disabled = false;
  undoButton.style.opacity = "1";
}

function addTile(){
  const empty = [];

  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      if(grid[r][c]===0){
        empty.push({r,c});
      }
    }
  }

  if(empty.length===0) return;

  const spot = empty[Math.floor(Math.random()*empty.length)];
  grid[spot.r][spot.c] = Math.random()<0.9 ? 2 : 4;
}

function render(){
  boardElement.innerHTML = "";

  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const value = grid[r][c];
      const cell = document.createElement("div");

      cell.className = "cell";

      if(value){
        cell.textContent = value;

        if(value<=2048){
          cell.classList.add("v"+value);
        }else{
          cell.classList.add("high");
        }
      }

      boardElement.appendChild(cell);
    }
  }

  scoreElement.textContent = score;
  bestElement.textContent = best;
}

function slide(row){
  let arr = row.filter(value=>value!==0);

  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){
      arr[i]*=2;
      score+=arr[i];
      arr.splice(i+1,1);
    }
  }

  while(arr.length<4){
    arr.push(0);
  }

  return arr;
}

function move(direction){
  if(gameOver) return;

  const oldGrid = JSON.stringify(grid);
  const oldScore = score;

  let newGrid = emptyGrid();

  for(let i=0;i<4;i++){
    let row = [];

    if(direction==="left"){
      row = [...grid[i]];
      newGrid[i] = slide(row);
    }

    if(direction==="right"){
      row = [...grid[i]].reverse();
      newGrid[i] = slide(row).reverse();
    }

    if(direction==="up"){
      row = grid.map(r=>r[i]);
      const result = slide(row);
      for(let j=0;j<4;j++) newGrid[j][i] = result[j];
    }

    if(direction==="down"){
      row = grid.map(r=>r[i]).reverse();
      const result = slide(row).reverse();
      for(let j=0;j<4;j++) newGrid[j][i] = result[j];
    }
  }

  if(JSON.stringify(newGrid)===oldGrid){
    return;
  }

  savePrevious();
  grid = newGrid;

  addTile();

  if(score>best){
    best = score;
    localStorage.setItem("2048Best",best);
  }

  render();
  checkGame();
}

function checkGame(){
  if(!won && grid.some(row=>row.includes(2048))){
    won = true;
    messageElement.innerHTML = "<strong>🎉 You reached 2048! You win!</strong>";
    return;
  }

  if(!canMove()){
    gameOver = true;
    messageElement.innerHTML = "<strong>Game Over!</strong> Final score: "+score;
    return;
  }

  messageElement.textContent = won
    ? "2048 reached! Keep playing!"
    : "Keep going! Make bigger numbers.";
}

function canMove(){
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      if(grid[r][c]===0) return true;

      if(c<3 && grid[r][c]===grid[r][c+1]) return true;
      if(r<3 && grid[r][c]===grid[r+1][c]) return true;
    }
  }
  return false;
}

function newGame(){
  grid = emptyGrid();
  score = 0;
  previous = null;
  won = false;
  gameOver = false;

  addTile();
  addTile();

  undoButton.disabled = true;
  undoButton.style.opacity = "0.5";

  messageElement.textContent = "Use arrow keys or swipe to play!";

  render();
}

function undo(){
  if(!previous) return;

  grid = previous.grid.map(row=>[...row]);
  score = previous.score;
  won = previous.won;
  gameOver = previous.gameOver;

  previous = null;
  undoButton.disabled = true;
  undoButton.style.opacity = "0.5";

  messageElement.textContent = "Last move undone!";
  render();
}

document.addEventListener("keydown",e=>{
  const keys = {
    ArrowLeft:"left",
    ArrowRight:"right",
    ArrowUp:"up",
    ArrowDown:"down"
  };

  if(keys[e.key]){
    e.preventDefault();
    move(keys[e.key]);
  }
});

let startX = 0;
let startY = 0;

boardElement.addEventListener("touchstart",e=>{
  const touch = e.changedTouches[0];
  startX = touch.clientX;
  startY = touch.clientY;
},{passive:true});

boardElement.addEventListener("touchend",e=>{
  const touch = e.changedTouches[0];

  const dx = touch.clientX-startX;
  const dy = touch.clientY-startY;

  if(Math.max(Math.abs(dx),Math.abs(dy))<25) return;

  if(Math.abs(dx)>Math.abs(dy)){
    move(dx>0?"right":"left");
  }else{
    move(dy>0?"down":"up");
  }
},{passive:true});

document.getElementById("newGame").addEventListener("click",newGame);
undoButton.addEventListener("click",undo);

newGame();
</script>

</body>
</html>
